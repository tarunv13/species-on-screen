  <!--
    First-paint darkness. The script is a module (deferred); its imported
    CSS arrives a moment later. This inline rule ensures the very first
    paint is near-black — absolute abyss — so a viewer arriving from the
    navigation sequence sees uninterrupted darkness, not a flash of white.
  -->
  <style>html,body{margin:0;padding:0;background:#02030a;}</style>
  <script type="module" src="/src/places/epr-vents.js"></script>
</head>
<body>
  <!--
    Canonical cinematic place page.
    Wired to: cinematic-language/narratives/east-pacific-rise-tubeworm-chemosynthesis.ts
    Research surface: notes/east-pacific-rise-tubeworm-chemosynthesis.html

    Rendering model: Canvas 2D, scroll-governed (Article III descent grammar).
    The canvas is fixed; the scroll-track provides the journey's depth.
    Captions are fixed overlays; their opacity is driven by scroll progress.

    Per platform-architecture §5: nothing on this page names the animal,
    the place, any coordinates, any counts, or any sources. The cinematic
    surface extracts only place.name (document title), place.editorialPlaceLine
    (meta description), and editorial.fragment (BEATS[6] inscription).
  -->
  <canvas id="epr-vents" aria-hidden="true"></canvas>

  <!-- Editorial fragments. One visible at a time (Article IX);
       injected and driven by scroll progress in epr-vents.js. -->
  <div class="captions" id="captions" aria-hidden="true"></div>

  <!-- Self-effacing descent invitation; gone after the first push. -->
  <div class="begin" id="begin" aria-hidden="true">descend</div>

  <!-- The scroll track gives the descent its depth. -->
  <div class="scroll-track" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">
      No light reaches the bottom of this.
    </div>
  </noscript>
</body>
