<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Field record · Sundarbans</title>
  <meta name="description" content="A scroll-driven field record of the Sundarbans mangrove tidal forest: the species-species-human interaction web, its seasons, and the cascade of a severed tide. Grounded in a Darwin Core Archive." />
  <script type="module" src="/src/prototypes/field-record.js"></script>
</head>
<body>
  <!--
    "Read the field record" — research-surface scrollytelling (prototype).
    -----------------------------------------------------------------------
    The research companion to the cinematic surfaces. Unlike the cinematic
    space, this surface NAMES, COUNTS, PLACES and CITES freely (platform-
    architecture §4): a sticky landscape stage carries the body-system
    motion vocabulary, while scroll-stepped, sourced text walks the viewer
    through the Sundarbans interaction web, its seasons, and the
    development cascade.

    The actors, their placement and their interactions are read at runtime
    from a real Darwin Core Archive at /dwca/sundarbans/ (Occurrence core +
    ResourceRelationship extension, GloBI/OBO interaction terms). Every
    actor and edge carries a citation.

    PROTOTYPE: dev-served from project root, excluded from the production
    build (vite.config.js excludes prototypes/). Additive and reversible.
    Cinematic surface untouched.
  -->
  <div class="fr" id="fr">
    <header class="fr-masthead">
      <div class="fr-eyebrow">Field record · research surface</div>
      <h1 id="fr-title">Sundarbans</h1>
      <p class="fr-sub" id="fr-sub">A mangrove tidal forest, read as a living interaction web — every actor placed, every relationship sourced.</p>
      <button id="fr-sound" class="fr-sound" type="button" aria-pressed="false">▷ Sound: off</button>
      <div class="fr-scrollhint" id="fr-scrollhint">scroll to begin ↓</div>
    </header>

    <div class="fr-scrolly">
      <div class="fr-graphic" aria-hidden="true">
        <canvas id="fr-canvas"></canvas>
        <div class="fr-season" id="fr-season"></div>
        <div class="fr-legend" id="fr-legend"></div>
      </div>
      <!-- glassmorphic species face-card, shown on hover over a species -->
      <div class="fr-speciescard" id="fr-speciescard" role="tooltip"></div>
      <div class="fr-steps" id="fr-steps">
        <!-- steps injected by field-record.js, bound to the DwC-A data -->
      </div>
    </div>

    <section class="fr-sources" id="fr-sources" aria-label="Sources and archive">
      <!-- sources, DwC term mapping, archive download, credits — injected -->
    </section>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;background:#f5f1e8;color:#20261f;display:grid;place-items:center;font-family:Georgia,serif;padding:2rem;text-align:center;">
      <div style="max-width:44ch;">
        <p style="font-style:italic;margin:0 0 1rem;">The field record is an interactive, scroll-driven page and needs JavaScript.</p>
        <p style="margin:0;">The attested record reads without it:
          <a href="../notes/sundarbans-bengal-tiger-saline-swimmer.html" style="color:#2f7d6b;">the field note</a>.</p>
      </div>
    </div>
  </noscript>
</body>
</html>
