<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Field record &middot; East Pacific Rise vent field</title>
  <meta name="description" content="A scroll-driven field record of the East Pacific Rise hydrothermal vent field: a chemosynthetic species-species-human interaction web with no sunlight in it, and the cascade of a disturbed vent. Grounded in a Darwin Core Archive." />
  <!--
    Canonical atlas page for the East Pacific Rise field record.
    ------------------------------------------------------------
    Research-surface scrollytelling: names, places, counts and cites freely
    (platform-architecture §4). The cinematic surface is untouched and shares
    no runtime with this file. Place is derived from the URL filename
    (epr-vents) by src/atlas/field-record.js, which reads the DwC-A at
    /dwca/epr-vents/ (assembled in M19).
  -->
  <script type="module" src="/src/atlas/field-record.js"></script>
</head>
<body>
  <div class="fr" id="fr">
    <header class="fr-masthead">
      <div class="fr-eyebrow">Field record &middot; research surface</div>
      <h1 id="fr-title">East Pacific Rise vent field</h1>
      <p class="fr-sub" id="fr-sub">A hydrothermal vent field read as a living interaction web &mdash; a food chain built on vent chemistry, not sunlight, every actor placed and every relationship sourced.</p>
      <button id="fr-sound" class="fr-sound" type="button" aria-pressed="false">&#9655; Sound: off</button>
      <div class="fr-scrollhint" id="fr-scrollhint">scroll to begin &#8595;</div>
    </header>

    <div class="fr-scrolly">
      <div class="fr-graphic" aria-hidden="true">
        <canvas id="fr-canvas"></canvas>
        <div class="fr-season" id="fr-season"></div>
        <div class="fr-legend" id="fr-legend"></div>
      </div>
      <!-- glassmorphic species face-card, shown on hover over a species -->
      <div class="fr-speciescard" id="fr-speciescard" role="tooltip"></div>
      <div class="fr-steps" id="fr-steps">
        <!-- steps injected by field-record.js, bound to the DwC-A data -->
      </div>
    </div>

    <section class="fr-sources" id="fr-sources" aria-label="Sources and archive">
      <!-- sources, DwC term mapping, archive download, credits — injected -->
    </section>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;background:#f5f1e8;color:#20261f;display:grid;place-items:center;font-family:Georgia,serif;padding:2rem;text-align:center;">
      <div style="max-width:44ch;">
        <p style="font-style:italic;margin:0 0 1rem;">The field record is an interactive, scroll-driven page and needs JavaScript.</p>
        <p style="margin:0;">The attested record reads without it:
          <a href="../notes/east-pacific-rise-tubeworm-chemosynthesis.html" style="color:#2f7d6b;">the field note</a>.</p>
      </div>
    </div>
  </noscript>
</body>
</html>
