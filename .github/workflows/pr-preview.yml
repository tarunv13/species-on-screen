name: PR preview deploy

# Builds and publishes a per-PR preview to gh-pages/preview/{pr-number}/.
# Posts (or updates) a comment on the PR with the live preview URL.
# Skipped for PRs from forks — fork PRs cannot write to gh-pages.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout PR (auto-merge ref)
        # Default ref for a pull_request event is refs/pull/{n}/merge — the
        # auto-generated merge commit. Building this previews the merged state.
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build preview with PR-scoped base path
        # Vite's --base CLI flag overrides the production base from vite.config.js.
        # All asset URLs, multi-entry HTML pages, and import.meta.env.BASE_URL
        # propagate this value at build time.
        run: npm run build -- --base=/species-on-screen/preview/${PR_NUMBER}/

      - name: Deploy preview to gh-pages
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          mv dist /tmp/new-dist

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::error::gh-pages branch does not exist."
            echo "::error::Merge a commit to main first; the production deploy workflow creates the branch."
            exit 1
          fi

          git fetch origin gh-pages:gh-pages
          git checkout gh-pages

          # Replace ONLY this PR's preview directory. Stale files from any
          # previous build for the same PR are removed by the rm -rf.
          rm -rf "preview/${PR_NUMBER}"
          mkdir -p "preview/${PR_NUMBER}"
          cp -r /tmp/new-dist/. "preview/${PR_NUMBER}/"

          git add -A
          if git diff --cached --quiet; then
            echo "No preview changes to deploy"
          else
            git commit -m "Deploy preview for PR #${PR_NUMBER} (${PR_SHA::7})"
            git push origin gh-pages
          fi

      - name: Comment on PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/${context.issue.number}/`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              '🎬 **Preview:** ' + previewUrl,
              '',
              'Built from `' + sha + '`. The preview updates on each push to this branch and is removed when the PR closes.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith('🎬 **Preview:**'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
