name: Verify evidentiary gate

# Runs the full evidence-preserving reference-implementation gate on every push
# and pull request, so the conformance definition cannot silently regress:
#
#   check-narratives   narrative registry invariants
#   check-manifest     Place Manifest bindings resolve
#   check-bindings     L1 interaction-claim traceability over the archives
#   check-dwca-xml     meta.xml/eml.xml are well-formed XML (no silent corruption
#                       in the archives shipped for download and external ingestion)
#   test:conformance   verdict-and-reason agreement over the versioned corpus
#   test:surface-links cross-depth (reciprocal descent) derivation
#   test:biome-backdrop biome-classification routing (every place type resolves
#                       to a diagnostic recipe, not a silent generic fallback)
#   test:dwca-xml      well-formedness scanner discriminates every claimed
#                       failure mode (negative-tested, not just pass-only)
#   check-grammar      the single composite Interaction-Grammar gate (D10):
#                       affordance placement (D3) · subject morph (D9) ·
#                       subject invariant (D1) · depth discreteness (D2)
#
# `npm run build` already enforces L1 traceability + XML well-formedness + the
# grammar gate via the prebuild hook; this workflow additionally runs the
# conformance harness and unit tests that build alone does not, so a change that
# breaks conformance or the grammar is caught before merge.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # D10 — the single composite Interaction-Grammar gate, run explicitly so a
      # grammar violation is attributable on its own (it is also part of verify).
      - name: Grammar gate (D10)
        run: npm run check-grammar

      - name: Verify evidentiary gate
        run: npm run verify
