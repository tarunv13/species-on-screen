name: PR preview cleanup

# Removes preview/{pr-number}/ from gh-pages when a PR is closed (merged or not).

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  cleanup:
    # Skip cleanup for fork PRs — their previews never deployed in the first place.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout (workspace required for git config)
        uses: actions/checkout@v4

      - name: Remove preview directory
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch does not exist; nothing to clean up"
            exit 0
          fi

          git fetch origin gh-pages:gh-pages
          git checkout gh-pages

          if [ -d "preview/${PR_NUMBER}" ]; then
            git rm -rf "preview/${PR_NUMBER}"
            git commit -m "Remove preview for closed PR #${PR_NUMBER}"
            git push origin gh-pages
          else
            echo "No preview directory for PR #${PR_NUMBER}; nothing to clean up"
          fi
