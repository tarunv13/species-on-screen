name: Deploy production to gh-pages

# Production build is published to the root of the gh-pages branch.
# Per-PR previews live alongside it under preview/{pr-number}/.
# All three gh-pages writer workflows (this, pr-preview.yml, pr-cleanup.yml)
# serialize via the gh-pages-write concurrency group below.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Deploy to gh-pages branch
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Move build artifact aside; switching branches will replace tracked files.
          mv dist /tmp/new-dist

          # Switch to gh-pages, creating it as an orphan branch if missing.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
            # Preserve any open PR previews across this production deploy.
            if [ -d preview ]; then
              mv preview /tmp/preview-backup
            fi
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          # Clear current root contents (preserves .git only).
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Lay down new production build.
          cp -r /tmp/new-dist/. .

          # Restore any preserved PR previews so production deploys never
          # wipe in-flight preview deployments.
          if [ -d /tmp/preview-backup ]; then
            mv /tmp/preview-backup preview
          fi

          # Disable Jekyll processing so files prefixed with _ are served as-is.
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No production changes to deploy"
          else
            git commit -m "Deploy production from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
