name: Deploy production

# Production publishes via GitHub Pages "GitHub Actions" source mode only.
# The build artifact is uploaded and deployed via actions/deploy-pages,
# which is what serves https://<owner>.github.io/<repo>/.
#
# We previously also mirrored the production build to the gh-pages branch
# root for compatibility with pr-preview.yml's directory layout. That step
# was removed because:
#
#   1. With Pages source = "GitHub Actions", gh-pages branch writes are
#      not served publicly, so the mirror was doing no useful work for
#      production.
#
#   2. Each push to gh-pages triggers GitHub's automatic, system-managed
#      "pages build and deployment" workflow. That workflow holds the
#      single Pages deployment slot while it runs. When two merges land
#      within ~60 seconds, the second merge's actions/deploy-pages call
#      collides with the first merge's still-in-flight legacy workflow
#      and fails with "Deployment request failed ... due to in progress
#      deployment" (PR #47, run 26411714029).
#
# The gh-pages-write concurrency group below still guards against
# pr-preview.yml and pr-cleanup.yml writing to gh-pages at the same time
# as each other, but they no longer race with this workflow because this
# workflow no longer touches gh-pages. PR-preview migration to per-PR
# Pages environments is a separate follow-up; pr-preview.yml's gh-pages
# pushes will continue to trigger their own legacy workflow runs, but
# only race with main-branch merges in the rare case that a PR is updated
# at the same instant a merge lands.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  pages: write        # for actions/configure-pages + actions/deploy-pages
  id-token: write     # OIDC token used by deploy-pages

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      # Programmatically enables Pages with source = "GitHub Actions" if
      # not already set. Idempotent on subsequent runs.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: pages-deploy
        uses: actions/deploy-pages@v4
