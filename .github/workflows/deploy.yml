name: Deploy production

# Production build is published two ways for now:
#
#   1. Via GitHub Pages "GitHub Actions" source mode (the canonical path).
#      The build artifact is uploaded and deployed via actions/deploy-pages,
#      which is what actually shows up at https://<owner>.github.io/<repo>/.
#
#   2. To the root of the gh-pages branch (legacy/auxiliary). Per-PR
#      previews from pr-preview.yml live alongside it under preview/{n}/.
#      Note that, with Pages source = "GitHub Actions", these branch
#      writes are no longer served publicly. They are kept for now to
#      avoid breaking pr-preview.yml's directory-management logic; that
#      workflow's URL output should be considered stale until preview
#      flows are migrated to per-PR Pages environments separately.
#
# All three gh-pages writer workflows (this, pr-preview.yml, pr-cleanup.yml)
# serialize via the gh-pages-write concurrency group below.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write     # for the gh-pages branch push
  pages: write        # for actions/configure-pages + actions/deploy-pages
  id-token: write     # OIDC token used by deploy-pages

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      # Programmatically enables Pages with source = "GitHub Actions" if
      # not already set. Idempotent on subsequent runs. Required because
      # the previous source-mode (Branch: gh-pages) had stopped serving
      # updated commits, leaving production stale by ~10 hours.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Legacy mirror to gh-pages branch. Kept for compatibility with
      # pr-preview.yml's directory layout. Does NOT serve content under
      # the new Pages-as-Actions configuration.
      - name: Mirror to gh-pages branch
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Copy aside before checkout overwrites the working tree.
          cp -r dist /tmp/new-dist

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
            # Preserve any open PR previews across this production deploy.
            if [ -d preview ]; then
              mv preview /tmp/preview-backup
            fi
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/new-dist/. .

          if [ -d /tmp/preview-backup ]; then
            mv /tmp/preview-backup preview
          fi

          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No production changes to deploy to gh-pages branch"
          else
            git commit -m "Mirror production build from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi

      - name: Deploy to GitHub Pages
        id: pages-deploy
        uses: actions/deploy-pages@v4
